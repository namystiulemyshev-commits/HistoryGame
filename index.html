
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History Game - Chapter 0</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Chapter 0: The Assignment</h1>
  <p>WASD / Arrow Keys: Move | E: Interact</p>

  <div id="game">
    <canvas id="world" width="800" height="480"></canvas>

    <div id="dialogue" class="hidden">
  <div class="dialogue-inner">
    
    <div class="dialogue-portrait-box">
      <img id="portrait" src="" alt="portrait">
    </div>

    <div class="dialogue-content">
      <div id="speaker">Professor</div>
      <div id="message">Dialogue goes here...</div>
      <div id="choices"></div>
      <button id="continue">Continue</button>
    </div>

  </div>
</div>

  <p id="objective">Objective: Talk to your professor.</p></div>


<!-- Chapter 2: Persian Geography Challenge -->
<div id="persiaQuiz" class="persia-quiz hidden">
  <div class="persia-quiz-panel">
    <div class="persia-quiz-heading">
      <div>
        <small>THE ROYAL GUARD'S CHALLENGE</small>
        <h2>The Seven Borders</h2>
        <p id="persiaQuizInstruction">
          Find Iran on the map.
        </p>
      </div>
      <button id="persiaQuizClose" type="button">✕</button>
    </div>

    <div class="persia-quiz-toolbar">
      <span id="persiaQuizScore">Find Iran first</span>
      <div>
        <button id="persiaZoomIn" type="button">+</button>
        <button id="persiaZoomOut" type="button">−</button>
        <button id="persiaZoomReset" type="button">
          Reset view
        </button>
      </div>
    </div>

    <div class="persia-map-container">
      <svg
        id="persiaWorldMap"
        viewBox="0 0 900 520"
        role="img"
        aria-label="Interactive country map"
      ></svg>
    </div>

    <div id="persiaCountryAnswer" class="persia-answer hidden">
      <label for="persiaCountryInput">
        Which country did you select?
      </label>
      <form id="persiaCountryForm">
        <input
          id="persiaCountryInput"
          type="text"
          placeholder="Enter country name"
          autocomplete="off"
        >
        <button type="submit">Confirm</button>
      </form>
    </div>

    <p id="persiaQuizFeedback" aria-live="polite"></p>

    <div class="persia-quiz-footer">
      <button id="persiaQuizHint" type="button">
        Ask for a hint
      </button>
      <button id="persiaQuizRestart" type="button">
        Restart challenge
      </button>
    </div>
  </div>
</div>


  
<script src="js/core.js"></script>
<script src="js/collision.js"></script>
<script src="js/player.js"></script>
<script src="js/chapter0.js"></script>
<script src="js/dialogue.js"></script>
<script src="js/teleport.js"></script>
<script src="js/chapter1.js"></script>
<script src="js/egyptArrival.js"></script>
<script src="js/egyptGuards.js"></script>
<script src="js/guardMinigame.js"></script>
<script src="js/egyptThrone.js"></script>
<script src="js/pharaohWordle.js"></script>
<script src="js/egyptSecretChamber.js"></script>
<script src="js/persia.js"></script>
<script src="js/persiaMapQuiz.js"></script>
<script src="js/persiaNPCs.js"></script>
<script src="js/main.js"></script>


</body>
</html>
